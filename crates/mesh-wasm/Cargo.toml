[package]
name = "mesh-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly bindings for the URDF Studio mesh kernel, URDF model and project packaging"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mesh-core = { path = "../mesh-core" }
urdf-core = { path = "../urdf-core" }
project-core = { path = "../project-core" }
glam.workspace = true
serde.workspace = true
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
