[workspace]
resolver = "2"
members = ["crates/mesh-core", "crates/urdf-core", "crates/project-core", "crates/mesh-wasm", "src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "1"

[profile.release.package.mesh-wasm]
opt-level = 3
